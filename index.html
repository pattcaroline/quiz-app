<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Frontend quiz app</title>
  </head>
  <body>
    <div class="theme-toggle-container">
      <img
        src="./assets/images/icon-sun-light.svg"
        alt="Light theme"
        class="theme-icon"
      />
      <!-- Switch Control -->
      <label for="toggle" class="toggle-switch">
        <input type="checkbox" name="" id="theme-checkbox" />
        <span class="slider"></span>
      </label>
      <img
        src="./assets/images/icon-moon-light.svg"
        alt="Dark theme"
        class="theme-icon"
      />
    </div>
    <!-- Quiz menu start -->

    Welcome to the Frontend Quiz! Pick a subject to get started. HTML CSS
    JavaScript Accessibility

    <!-- Quiz menu end -->

    <!-- Quiz question start -->

    Question
    <!-- number -->
    of 10 A B C D Submit answer

    <!-- Quiz question end -->

    <!-- Quiz completed start -->

    Quiz completed You scored...

    <!-- score -->
    out of 10

    <!-- Quiz completed end -->
  </body>
</html>
